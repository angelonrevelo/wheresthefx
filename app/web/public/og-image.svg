<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Where's the f(x) — Metro Manila event map">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111118"/>
      <stop offset="55%" stop-color="#1a1a1f"/>
      <stop offset="100%" stop-color="#241d2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- Loose scatter suggesting pins across the metro. Decorative only. -->
  <g fill="none" stroke="#3f3f52" stroke-width="1.5" opacity="0.5">
    <path d="M0 470 C 180 430, 300 500, 470 455 S 820 400, 1200 448"/>
    <path d="M0 530 C 220 500, 360 560, 540 520 S 900 470, 1200 512"/>
  </g>
  <g fill="#c084fc">
    <circle cx="236" cy="452" r="5" opacity="0.9"/>
    <circle cx="418" cy="470" r="4" opacity="0.7"/>
    <circle cx="612" cy="436" r="6" opacity="0.95"/>
    <circle cx="795" cy="462" r="4" opacity="0.65"/>
    <circle cx="951" cy="441" r="5" opacity="0.8"/>
  </g>
  <circle cx="612" cy="436" r="70" fill="url(#glow)"/>

  <text x="90" y="238"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="150" font-style="italic" fill="#fafafa">
    f(x)
  </text>

  <text x="94" y="330"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="40" font-weight="600" fill="#e9d5ff" letter-spacing="1">
    Where&#8217;s the f(x)
  </text>

  <text x="94" y="386"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="27" fill="#a1a1aa">
    Parties, markets and gigs happening in Metro Manila
  </text>

  <text x="94" y="576"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="23" fill="#71717a" letter-spacing="2">
    wheresthefx.com
  </text>
</svg>
